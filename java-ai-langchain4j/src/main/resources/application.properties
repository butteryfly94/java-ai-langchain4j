#web服务的端口号
server.port=8080

langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.open-ai.chat-model.model-name=deepseek-v3

#应用程序发送给大模型的请求日志和响应日志
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=deepseek-r1:1.5b
langchain4j.ollama.chat-model.temperature=0.8
langchain4j.ollama.chat-model.timeout=PT60S

#应用程序发送给大模型的请求日志和响应日志
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

#阿里百炼平台（注意：带日期的快照版本如qwen-max-2025-01-25已被下线，用稳定版名称）
langchain4j.community.dashscope.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-max

#集成阿里通义千问-流式输出
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-plus

#集成阿里通义千问-通用文本向量-v3
langchain4j.community.dashscope.embedding-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3

#MongoDB连接配置
spring.data.mongodb.uri=mongodb://localhost:27017/chat_memory_db

# 基本数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 开启 SQL 日志打印
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#将系统日志设置为debug级别
logging.level.root=info

#=============== 生产级RAG配置 ===============
#Elasticsearch连接配置（docker compose up -d 启动）
elasticsearch.host=localhost
elasticsearch.port=9200

#索引名称：子块索引（存向量+文本，供kNN向量检索与BM25全文检索共用）、父块索引（存父块原文，供检索后扩展上下文）
rag.index.children=knowledge-children
rag.index.parents=knowledge-parents

#知识库文档目录（离线索引管线的输入）
rag.knowledge-dir=knowledge

#检索链路参数
rag.retrieval.max-results-per-retriever=20
rag.retrieval.rrf-k=60
rag.retrieval.top-children=8
rag.retrieval.top-parents=3
#rerank开关（关掉可对比纯RRF效果）
rag.retrieval.rerank-enabled=true

#Agentic RAG与MCP（需要本机安装Node.js，关闭后agentic-chat接口返回503）
rag.mcp.enabled=true

#=============== 问题复杂度路由 ===============
#总开关，false时/chat恒走普通RAG（回到改造前行为）
rag.router.enabled=true
#规则判不出时是否调LLM分类兜底，false则直接走普通RAG
rag.router.llm-fallback=true
#分类专用轻量模型（二分类任务，不必用qwen-max）
rag.router.model=qwen-turbo
#不超过此长度且无复杂信号 → 普通RAG
rag.router.simple-max-chars=15
#超过此长度 → Agentic RAG
rag.router.complex-min-chars=60
